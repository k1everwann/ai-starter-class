name: Prepare and check classroom site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-site.yml'
      - '.bootstrap/**'
      - '*.html'
      - '*.js'
      - '*.css'
      - 'tests/*.py'
      - 'requirements-test.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: classroom-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the reviewed guided-classroom revision if present
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, lzma
          parts = sorted(Path('.bootstrap').glob('guided-v2.*'))
          if parts:
              payload = b''.join(p.read_bytes() for p in parts)
              assert hashlib.sha256(payload).hexdigest() == 'ff0b68c8c4defbe9112399fce3c895010566877d482e56ed33874f49910f7690', 'Revision checksum mismatch'
              files = json.loads(lzma.decompress(payload))
              allowed = {'app.js', 'content.js', 'style.css', 'screens.js', 'STUDENT.md', 'GUIDED-UPDATE.md', 'tests/browser_check.py', 'tests/standalone_check.py'}
              assert set(files) == allowed, 'Unexpected revision paths'
              outputs = {}
              for name, spec in files.items():
                  path = Path(name)
                  if 'ops' in spec:
                      raw = path.read_bytes()
                      sha = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
                      assert sha == spec['before'], 'Concurrent edit detected: ' + name
                      old = raw.decode('utf-8')
                      pos, chunks = 0, []
                      for start, end, text in spec['ops']:
                          assert pos <= start <= end <= len(old), 'Invalid patch range'
                          chunks.extend([old[pos:start], text])
                          pos = end
                      chunks.append(old[pos:])
                      outputs[name] = ''.join(chunks)
                  else:
                      outputs[name] = spec['content']
                  assert isinstance(outputs[name], str), 'Non-text revision'
              test = outputs['tests/browser_check.py']
              anchor = "    p.locator('.start-button').click()\n"
              assert test.count(anchor) == 1
              test = test.replace(anchor, anchor + "    p.locator('.handoff-step').first.wait_for(state='visible')\n")
              outputs['tests/browser_check.py'] = test
              app = outputs['app.js']
              anchor = "  if($('#guide-prompt-adjust'))$('#guide-prompt-adjust').textContent=guideText('adjust');\n"
              assert app.count(anchor) == 1
              app = app.replace(anchor, anchor + "  const recopy=$('[data-action=guide-copy][data-key=adjust]');if(recopy){recopy.textContent='複製這段話';recopy.classList.add('primary');}\n  const reopen=$('[data-open-tool=adjust]');if(reopen)reopen.classList.remove('primary');\n")
              outputs['app.js'] = app
              for name, text in outputs.items():
                  Path(name).write_text(text, encoding='utf-8')
              print('Applied reviewed source updates with deterministic navigation checks.')
      - name: Install the test browser and Chinese fonts
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Select the browser bundled with this Playwright version
        shell: python
        run: |
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              executable = p.chromium.executable_path
              assert Path(executable).is_file(), 'Bundled Chromium was not installed'
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
                  env.write('CHROMIUM_EXECUTABLE=' + executable + '\n')
              print('Selected matching Chromium:', executable)
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check content.js
          node --check starter.js
          node --check screens.js
      - name: Test guided actions on a real origin and regenerate twelve screenshots
        run: python tests/browser_check.py
      - name: Build and check the downloadable single-file edition
        run: |
          python scripts/build_standalone.py
          python tests/standalone_check.py
          cp ../ai-starter-class-standalone.html ./ai-starter-class-standalone.html
      - name: Save verified source and screenshot updates
        run: |
          rm -f .bootstrap/guided-v2.*
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app.js content.js style.css screens.js tests assets STUDENT.md GUIDED-UPDATE.md ai-starter-class-standalone.html
          git add -u -- .bootstrap || true
          if ! git diff --cached --quiet; then
            git commit -m 'Publish guided lessons, local HTML import, safe title editing and verified screenshots'
            git push origin HEAD:main
          fi
      - name: Package the deployable site
        run: |
          mkdir -p _site
          cp index.html style.css app.js content.js starter.js screens.js example-game.html scenario-data.txt ai-starter-class-standalone.html .nojekyll _site/
          cp -R assets _site/assets
      - uses: actions/upload-artifact@v4
        with:
          name: ai-starter-class-site
          path: _site
          include-hidden-files: true
          retention-days: 14
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guided-classroom-verification
          path: |
            tests/results.json
            tests/standalone-results.json
          retention-days: 14
      - name: Record publication scope
        run: |
          echo '## Guided classroom checks finished' >> "$GITHUB_STEP_SUMMARY"
          echo 'Preparation success is not proof of a GitHub Pages deployment. Check the separate Pages deployment for the published commit.' >> "$GITHUB_STEP_SUMMARY"
