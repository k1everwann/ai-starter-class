name: Check AI pocket activities
on:
  push:
    paths:
      - 'play/**'
      - 'tests/pocket_check.py'
      - '.github/workflows/check-pocket.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test the real local HTTP page
        run: python tests/pocket_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocket-hub-screenshots
          path: tests/pocket-screens/
          if-no-files-found: ignore
