<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的單字遊戲</title>
<style>body{font:17px/1.7 system-ui,-apple-system,sans-serif;color:#202831;max-width:560px;margin:25px auto;padding:0 20px}h1{font-size:25px;margin-bottom:6px}h2{font-size:27px}button{font:inherit;cursor:pointer;border:1px solid #aeb8c4;background:white;color:#202831;border-radius:5px;min-height:48px;padding:9px 14px}button:focus-visible{outline:3px solid #2056a3;outline-offset:2px}button:disabled{opacity:.55;cursor:default}#answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bar{display:flex;gap:10px;margin-top:18px}#next{background:#2056a3;color:white;border-color:#2056a3}.small{font-size:12px;color:#596572}#result{min-height:28px}@media(max-width:340px){#answers{grid-template-columns:1fr}}</style></head>
<body>
<h1 id="game-title">我的單字遊戲</h1>
<p class="small">課程預備範例。請改一點，再親手測試。</p>
<p id="count"></p><h2 id="word"></h2><div id="answers"></div>
<p id="result" role="status" aria-live="polite"></p><p id="score"></p>
<div class="bar"><button id="next" disabled>下一題</button><button id="reset">重新開始</button></div>
<script>
'use strict';
// Add a question here; the total score updates automatically.
const questions=[
 {word:'discover',options:['發現','準備','保護','比較'],correct:0},
 {word:'prepare',options:['比較','保護','準備','解釋'],correct:2},
 {word:'protect',options:['準備','保護','解釋','發現'],correct:1},
 {word:'compare',options:['解釋','發現','保護','比較'],correct:3},
 {word:'explain',options:['解釋','比較','發現','準備'],correct:0}
];
const get=id=>document.getElementById(id);
let current=0,score=0,answered=false;
function show(){
 answered=false;
 get('count').textContent='第 '+(current+1)+' / '+questions.length+' 題';
 get('word').textContent=questions[current].word;
 get('result').textContent='';
 get('score').textContent='目前得分：'+score;
 get('next').disabled=true;
 get('answers').replaceChildren();
 questions[current].options.forEach((text,index)=>{
  const button=document.createElement('button');
  button.textContent=text;
  button.onclick=()=>{
   if(answered)return;
   answered=true;
   const good=index===questions[current].correct;
   if(good)score++;
   get('result').textContent=good?'答對了！':'正確意思：'+questions[current].options[questions[current].correct];
   get('score').textContent='目前得分：'+score;
   get('answers').querySelectorAll('button').forEach(b=>b.disabled=true);
   get('next').disabled=false;
  };
  get('answers').append(button);
 });
}
get('next').onclick=()=>{
 if(!answered)return;
 current++;
 if(current<questions.length){show();return;}
 get('count').textContent='全部完成';
 get('word').textContent='你的分數：'+score+' / '+questions.length;
 get('answers').replaceChildren();
 get('result').textContent='還想再試一次嗎？';
 get('score').textContent='';
 get('next').disabled=true;
};
get('reset').onclick=()=>{current=0;score=0;show();};
show();
</script></body></html>
